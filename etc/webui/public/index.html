<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#11141a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PICAR-2 Mapping</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="bar">
  <span id="dot" class="dot"></span>
  <span id="state">connecting…</span>
  <span class="spacer"></span>
  <span id="chips"></span>
</header>

<canvas id="map"></canvas>

<div id="hint" class="hint">Choose <b>Mapping</b> to build a new map, or <b>Localize</b> to use one you saved.</div>

<div id="stick" class="stick hidden">
  <div id="knob" class="knob"></div>
</div>

<footer id="controls">
  <div id="modepill" class="pill">
    <button id="m-idle" class="seg" data-mode="idle">Off</button>
    <button id="m-map" class="seg" data-mode="mapping">Mapping</button>
    <button id="m-loc" class="seg" data-mode="localize">Localize</button>
  </div>
  <button id="explore" class="btn hidden">Explore automatically</button>
  <button id="save" class="btn hidden">Finish &amp; save</button>
  <button id="setpose" class="btn hidden">Set position</button>
  <button id="goto" class="btn hidden">Go to…</button>
  <button id="cancelgoal" class="btn danger hidden">Cancel goal</button>
  <button id="changemap" class="btn hidden">Change map</button>
</footer>

<div id="sheet" class="sheet hidden">
  <div class="sheet-inner">
    <h2>Save this map</h2>
    <p>Saving seals the map — the robot stops adding to it.</p>
    <input id="mapname" type="text" placeholder="e.g. ground-floor" autocomplete="off">
    <div class="sheet-buttons">
      <button id="cancel-save" class="btn">Cancel</button>
      <button id="confirm-save" class="btn primary">Save</button>
    </div>
    <div id="saveerr" class="err"></div>
  </div>
</div>

<div id="mapsheet" class="sheet hidden">
  <div class="sheet-inner">
    <h2>Load a map</h2>
    <p>The robot will localize against this map instead of building a new one.</p>
    <div id="maplist" class="maplist"></div>
    <div class="sheet-buttons">
      <button id="cancel-load" class="btn">Cancel</button>
    </div>
    <div id="loaderr" class="err"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
