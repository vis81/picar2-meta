; PICAR-2 in-container process supervisor.
;
; One container, one host unit (picar.service), and supervisord as PID 1 owning
; everything inside. The web UI drives the on-demand programs over the XML-RPC
; socket below — a local call inside its own container, so no privilege, no
; D-Bus and no root are needed anywhere.
;
; The point of this file is that a program can be restarted without taking its
; neighbours down. The navigation layers used to be children of the web UI, so
; restarting the UI to pick up a code change tore down AMCL and Nav2 with it.

[supervisord]
nodaemon=true                    ; PID 1: stay in the foreground
logfile=/ws/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/tmp/supervisord.pid
; Logs go under the workspace, which is bind-mounted from the host. The
; container's own filesystem is destroyed on every restart, and that is exactly
; when the log is wanted.
childlogdir=/ws/logs

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Every program below sets stopasgroup/killasgroup. `ros2 launch` forks a tree of
; nodes, so signalling the launch process alone leaves them orphaned and still
; publishing — which for two map sources at once is not merely untidy but wrong.
; Same reason ModeStack killed process groups rather than processes.

; ── always on ────────────────────────────────────────────────────────────────

[program:bringup]
command=/ws/etc/run-layer.sh bringup
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/ws/logs/bringup.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true
priority=10

[program:webui]
command=/ws/etc/run-layer.sh webui
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/ws/logs/webui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true
priority=20

; ── started on demand by the web UI ──────────────────────────────────────────
; autostart=false: which of these should run is a mode decision the UI owns.
; cartographer/slam_toolbox and AMCL both publish /map and broadcast map->odom,
; so they must never run together; supervisord has no equivalent of systemd's
; Conflicts=, and that exclusion stays in ModeStack where it already works.
;
; Their arguments vary at runtime — which SLAM backend, which saved map — so
; each reads them from /ws/run/<layer>.args, written by the UI just before it
; starts the program. That avoids rewriting this file and calling reread/update
; on every mode switch.

[program:map]
command=/ws/etc/run-layer.sh map
autostart=false
autorestart=false
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/ws/logs/map.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true

[program:amcl]
command=/ws/etc/run-layer.sh amcl
autostart=false
autorestart=false
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/ws/logs/amcl.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true

[program:nav]
command=/ws/etc/run-layer.sh nav
autostart=false
autorestart=false
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/ws/logs/nav2.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true

[program:explore]
command=/ws/etc/run-layer.sh explore
